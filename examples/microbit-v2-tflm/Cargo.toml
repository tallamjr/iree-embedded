# Self-contained example workspace: the firmware plus its copy of cycle-stats.
# It does not use IREE. The TFLite-Micro C++ sources are fetched by
# scripts/fetch-tflm.sh and compiled by build.rs.
[workspace]
members = ["cycle-stats"]

[package]
name = "microbit-v2-tflm"
version = "0.1.0"
edition = "2024"
publish = false
description = "micro:bit v2 timing firmware for the TFLite-Micro baseline (reference kernels)."

[dependencies]
cycle-stats = { path = "cycle-stats" }
# Safe one-time access to the static arena and cycle buffers.
static_cell = "2"
# Safe reinterpretation of the feature bytes as i8 values.
bytemuck = { version = "1", default-features = false }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
nrf-pac = { version = "0.3", features = ["nrf52833"] }
embassy-nrf = { version = "0.10", features = [
    "nrf52833",
    "gpiote",
    "defmt",
] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
opt-level = "z"
lto = true
debug = 2
